<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thematic Sketchbook</title>
<style>
  :root{
    --navy:#0B2545; --navy-deep:#071A33; --brass:#C9A24B; --brass-light:#E4C77C;
    --paper:#F3EEE1; --paper-line:#DCD3BC; --ink:#1B2430; --ink-soft:#4B5563;
    --ocean:#2E6E62; --coral:#D9603B; --success:#3F8F5C; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--navy-deep); font-family:"Segoe UI", Verdana, Geneva, sans-serif; color:var(--ink); min-height:100vh; }

  header{ background:var(--navy); color:var(--paper); padding:26px 16px 22px; border-bottom:3px solid var(--brass); text-align:center; }
  h1{ font-family:Georgia,"Palatino Linotype",serif; font-size:clamp(24px,6vw,34px); margin:0 0 6px; }
  .subtitle{ color:var(--brass-light); font-size:14px; margin:0 0 16px; }

  .scoreboard{
    display:inline-flex; gap:18px; background:rgba(255,255,255,0.06); border:1px solid rgba(228,199,124,0.35);
    border-radius:999px; padding:10px 22px; font-size:14px; font-weight:700;
  }
  .scoreboard span.big{ font-family:Georgia,serif; font-size:18px; color:var(--brass-light); }

  main{ max-width:820px; margin:0 auto; padding:22px 16px 60px; }

  .grid{ display:grid; grid-template-columns:1fr; gap:16px; }
  @media (min-width:640px){ .grid{ grid-template-columns:1fr 1fr; } }

  .book{
    background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius);
    overflow:hidden;
  }
  .book-head{
    display:flex; align-items:center; gap:12px; padding:16px;
  }
  .book-icon{ font-size:30px; line-height:1; flex:0 0 auto; }
  .book-title{ font-family:Georgia,"Palatino Linotype",serif; font-size:18px; margin:0; }
  .book-sub{ font-size:13px; color:var(--ink-soft); margin:2px 0 0; }
  .book-progress{ margin-left:auto; font-size:12px; font-weight:700; color:var(--ocean); white-space:nowrap; }

  .book.locked .book-icon{ opacity:0.45; filter:grayscale(1); }
  .book.locked .book-title, .book.locked .book-sub{ color:var(--ink-soft); }
  .lock-badge{
    margin-left:auto; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    background:var(--paper-line); color:var(--ink-soft); padding:4px 10px; border-radius:999px;
  }

  details > summary{ cursor:pointer; list-style:none; }
  details > summary::-webkit-details-marker{ display:none; }
  details[open] .book-head{ border-bottom:1px solid var(--paper-line); }
  .chevron{ transition:transform .2s ease; flex:0 0 auto; color:var(--ink-soft); }
  details[open] .chevron{ transform:rotate(90deg); }

  .concept-list{ list-style:none; margin:0; padding:6px 12px 12px; }
  .concept-list li{ margin:0; }
  .concept-list a{
    display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:8px;
    color:var(--ink); text-decoration:none; font-size:14px; font-weight:600;
  }
  .concept-list a:hover{ background:#EAF3F0; }
  .concept-list .status{ font-size:16px; flex:0 0 auto; width:20px; text-align:center; }
  .concept-list .locked-row{ display:flex; align-items:center; gap:10px; padding:10px 8px; font-size:14px; color:var(--ink-soft); }

  .coming-soon-note{ padding:0 16px 16px; font-size:13px; color:var(--ink-soft); }

  .badge-toast{
    position:fixed; top:16px; left:50%; transform:translate(-50%,-140%);
    background:var(--brass-light); color:var(--navy-deep); font-weight:700; padding:10px 18px;
    border-radius:10px; transition:transform .35s ease; z-index:10;
  }
  .badge-toast.show{ transform:translate(-50%,0); }
</style>
</head>
<body>

  <p class="subtitle">Pick a world. Every idea connects to another.</p>
  <div class="scoreboard">

    <span>✅ <span class="big" id="total-done">0</span> pages done</span>
  </div>
  <p style="margin:14px 0 0;">
    <a href="sketchbook-gallery.html" style="color:var(--brass-light); font-size:13px; font-weight:700; text-decoration:none; border:1px solid rgba(228,199,124,0.5); border-radius:999px; padding:6px 16px;">
      🖼️ My Sketchbook — <span id="gallery-count">0</span> drawing<span id="gallery-plural">s</span> saved
    </a>
  </p>
</header>

<main>
  <div class="grid" id="book-grid"></div>
</main>

<div class="badge-toast" id="badge-toast">🎖️ New page finished!</div>

function loadConceptState(conceptId){
  try{
    var raw = localStorage.getItem("sketchbook-progress::" + conceptId);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function renderGrid(){
  var grid = document.getElementById("book-grid");
  grid.innerHTML = "";
  var totalXp = 0, totalDone = 0;

  BOOKS.forEach(function(book){
    if(book.external){
      var a = document.createElement("a");
      a.href = book.externalUrl;
      a.style.textDecoration = "none";
      a.style.color = "inherit";
      var wrap = document.createElement("div");
      wrap.className = "book";
      wrap.innerHTML =
        '<div class="book-head">' +
          '<span class="book-icon">' + book.icon + '</span>' +
          '<div><p class="book-title">' + book.title + '</p><p class="book-sub">' + book.subtitle + '</p></div>' +
        '</div>';
      a.appendChild(wrap);
      grid.appendChild(a);
      return;
    }

    if(book.locked){
      var lockedWrap = document.createElement("div");
      lockedWrap.className = "book locked";
      lockedWrap.innerHTML =
        '<div class="book-head">' +
          '<span class="book-icon">' + book.icon + '</span>' +
          '<div><p class="book-title">' + book.title + '</p><p class="book-sub">' + book.subtitle + '</p></div>' +
          '<span class="lock-badge">Coming soon</span>' +
        '</div>' +
        '<p class="coming-soon-note">This world is being sketched right now — check back soon!</p>';
      grid.appendChild(lockedWrap);
      return;
    }

    // active, expandable book
    var doneCount = 0;
    var listItems = book.concepts.map(function(c){
      if(!c.file){
        return '<li><span class="locked-row"><span class="status">🔒</span>' + c.label + ' <span style="margin-left:auto;font-size:12px;">coming soon</span></span></li>';
      }
      var state = loadConceptState(c.id);
      var expectedMissions = book.missionCount || 8;
      var isDone = state && state.completed && state.completed.length === expectedMissions;
      if(state){ totalXp += state.xp || 0; }
      if(isDone){ doneCount++; totalDone++; }
      var icon = isDone ? "✅" : (state ? "🟡" : "⬜");
      return '<li><a href="' + c.file + '"><span class="status">' + icon + '</span>' + c.label + '</a></li>';
    }).join("");

    var builtCount = book.concepts.filter(function(c){ return c.file; }).length;
    var totalCount = book.concepts.length;

    var details = document.createElement("details");
    details.className = "book";
    details.innerHTML =
      '<summary>' +
        '<div class="book-head">' +
          '<span class="book-icon">' + book.icon + '</span>' +
          '<div><p class="book-title">' + book.title + '</p><p class="book-sub">' + book.subtitle + '</p></div>' +
          '<span class="book-progress">' + doneCount + '/' + builtCount + ' built' + (totalCount > builtCount ? ' · ' + (totalCount - builtCount) + ' more soon' : '') + '</span>' +
          '<svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>' +
        '</div>' +
      '</summary>' +
      '<ul class="concept-list">' + listItems + '</ul>';
    grid.appendChild(details);
  });

  document.getElementById("total-xp").textContent = totalXp;
  document.getElementById("total-done").textContent = totalDone;

  var galleryCount = 0;
  for(var i = 0; i < localStorage.length; i++){
    var k = localStorage.key(i);
    if(k && k.indexOf("sketchbook-gallery::") === 0){ galleryCount++; }
  }
  document.getElementById("gallery-count").textContent = galleryCount;
  document.getElementById("gallery-plural").textContent = galleryCount === 1 ? "" : "s";
}

renderGrid();
</script>
